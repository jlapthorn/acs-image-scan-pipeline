apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: acs-image-scan
  namespace: acs-pipeline
spec:
  params:
    - name: image
      type: string
      description: Full image reference to scan
      default: "registry.redhat.io/ubi9/ubi-minimal:latest"
    - name: acs_central_endpoint
      type: string
      description: ACS Central endpoint (host:port)
      default: "central-stackrox.apps.cluster-m7s8x.dyn.redhatworkshops.io:443"
    - name: output_format
      type: string
      description: Output format (table, json, csv)
      default: "table"
  tasks:
    - name: scan-image
      taskRef:
        name: acs-image-scan
      params:
        - name: image
          value: $(params.image)
        - name: acs_central_endpoint
          value: $(params.acs_central_endpoint)
        - name: output_format
          value: $(params.output_format)
