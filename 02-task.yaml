apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: acs-image-scan
  namespace: acs-pipeline
spec:
  params:
    - name: image
      type: string
      description: Full image reference to scan
      default: "registry.redhat.io/ubi9/ubi-minimal:latest"
    - name: acs_central_endpoint
      type: string
      description: ACS Central endpoint (host:port)
      default: "central-stackrox.apps.cluster-m7s8x.dyn.redhatworkshops.io:443"
    - name: output_format
      type: string
      description: Output format (table, json, csv)
      default: "table"
  steps:
    - name: download-roxctl
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      env:
        - name: ROX_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: roxctl-api-token
              key: rox_api_token
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "Downloading roxctl from https://$(params.acs_central_endpoint)..."
        curl -sfL -k \
          -H "Authorization: Bearer ${ROX_API_TOKEN}" \
          "https://$(params.acs_central_endpoint)/api/cli/download/roxctl-linux" \
          -o /shared/roxctl

        chmod +x /shared/roxctl
        /shared/roxctl version
        echo "roxctl downloaded successfully."
      volumeMounts:
        - name: shared
          mountPath: /shared

    - name: scan-image
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      env:
        - name: ROX_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: roxctl-api-token
              key: rox_api_token
        - name: ROX_CENTRAL_ADDRESS
          value: "$(params.acs_central_endpoint)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "============================================"
        echo "Scanning image: $(params.image)"
        echo "ACS Central:    ${ROX_CENTRAL_ADDRESS}"
        echo "============================================"

        /shared/roxctl image scan \
          --insecure-skip-tls-verify \
          --endpoint "${ROX_CENTRAL_ADDRESS}" \
          --image "$(params.image)" \
          --output "$(params.output_format)"

        echo ""
        echo "============================================"
        echo "Running image check (policy evaluation)..."
        echo "============================================"

        /shared/roxctl image check \
          --insecure-skip-tls-verify \
          --endpoint "${ROX_CENTRAL_ADDRESS}" \
          --image "$(params.image)" \
          --output "$(params.output_format)" || true
      volumeMounts:
        - name: shared
          mountPath: /shared

  volumes:
    - name: shared
      emptyDir: {}
